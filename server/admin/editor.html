<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Textes du site · Lunavia</title><link rel="stylesheet" href="/admin-assets/style.css"><script type="module" src="/admin-assets/editor.js"></script></head><body>
<header><div class="brand">Lunavia <small>TRAVEL &amp; TOURISM</small></div><div class="controls"><a href="/" target="_blank" rel="noopener">Voir le site</a><button id="logout">Déconnexion</button></div></header>
<main class="desk"><h1>Textes du site</h1><p id="revision"></p>
<div class="filters"><label>Rubrique<select id="section"><option>Toutes les rubriques</option></select></label><div role="group" class="language" aria-label="Langue du contenu"><button id="fr" aria-pressed="true">Français</button><button id="ar" lang="ar" dir="rtl" aria-pressed="false">العربية</button></div><label>Rechercher un texte<input type="search" id="search"></label></div>
<div class="controls"><button id="save" disabled>Enregistrer le brouillon</button><button class="primary" id="publish" disabled>Publier les textes</button></div>
<p id="status" role="status" aria-live="polite"></p><div id="fields"></div><div class="controls paging"><button id="prev">Précédent</button><span id="range"></span><button id="next">Suivant</button></div>
<details><summary>Identifiant et mot de passe</summary><form id="account"><label>Mot de passe actuel<input type="password" name="current" autocomplete="current-password" required maxlength="256"></label><label>Nouvel identifiant<input name="username" autocomplete="username" pattern="[A-Za-z0-9_.\-]{3,64}" required maxlength="64"></label><label>Nouveau mot de passe (12 caractères minimum)<input type="password" name="password" autocomplete="new-password" required minlength="12" maxlength="256"></label><button>Mettre à jour et se reconnecter</button><p id="account-status" role="alert"></p></form></details></main></body></html>
